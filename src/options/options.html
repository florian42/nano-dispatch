<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nano-dispatch — Options</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        color-scheme: light dark;
      }
      body {
        max-width: 520px;
        margin: 32px auto;
        padding: 0 16px;
        line-height: 1.4;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      .subtitle {
        color: #6b7280;
        font-size: 13px;
        margin-bottom: 24px;
      }
      label {
        display: block;
        margin-bottom: 16px;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      button {
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 4px;
        cursor: pointer;
        background: #1d4ed8;
        color: white;
        border: 1px solid #1d4ed8;
      }
      #status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 6px;
        background: #f3f4f6;
        font-size: 13px;
      }
      #status.error {
        background: #fee2e2;
        color: #991b1b;
      }
      #status.ok {
        background: #d1fae5;
        color: #065f46;
      }
      .footnote {
        margin-top: 24px;
        font-size: 12px;
        color: #6b7280;
      }
      code {
        background: #f3f4f6;
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>nano-dispatch</h1>
    <p class="subtitle">Configure your Telegram bot. Saved locally; never synced.</p>

    <label>
      Bot token
      <input id="bot-token" type="password" placeholder="123456:abc..." autocomplete="off" />
    </label>

    <label>
      Chat ID
      <input id="chat-id" type="text" placeholder="-1001234567890 or 123456" autocomplete="off" />
    </label>

    <button id="save" type="button">Save</button>

    <div id="status" hidden></div>

    <p class="footnote">
      If this token may have leaked, run <code>/revoke</code> in <code>@BotFather</code> to rotate
      it, then paste the new token here.
    </p>

    <script type="module" src="./options/options.js"></script>
  </body>
</html>
